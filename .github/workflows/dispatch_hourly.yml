name: dispatch-1h
on:
  schedule:
    - cron: '25 8-13 * * 0-4'
  workflow_dispatch: {}
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger hourly pipeline on hourly branch
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listRepoWorkflows({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const wf = data.workflows.find(
              (w) => w.path === '.github/workflows/daily_update_1h.yml'
            );
            if (!wf) {
              throw new Error(
                'daily_update_1h.yml not found in workflow registry'
              );
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: wf.id,
              ref: 'hourly',
            });
